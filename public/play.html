<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quiz Battle - Play</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --team1: #e21b3c; --team2: #1368ce; --team3: #d89e00;
    --team4: #26890c; --team5: #9b59b6; --team6: #e67e22;
    --bg: #1a0533; --card: #2d1150; --text: #f2f2f2;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 16px;
  }
  h1 { font-size: 1.8rem; text-align: center; margin-bottom: 20px; letter-spacing: 1px; }

  .screen { display: none; width: 100%; max-width: 440px; }
  .screen.active { display: block; }

  /* Join screen */
  #join-screen { text-align: center; padding-top: 20px; }
  #join-screen label { display: block; text-align: left; font-weight: 600; margin: 14px 0 6px; font-size: .95rem; }
  #join-screen input {
    width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 8px;
    border: 2px solid rgba(255,255,255,.2); background: var(--card); color: #fff;
    outline: none;
  }
  #join-screen input:focus { border-color: #7b2ff7; }

  .team-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .team-option {
    padding: 12px 8px; border-radius: 8px; text-align: center;
    font-weight: 700; font-size: .95rem; cursor: pointer;
    border: 3px solid transparent; color: #fff; opacity: .7;
    transition: opacity .2s, border-color .2s, transform .15s;
  }
  .team-option:hover { opacity: .9; }
  .team-option.selected { opacity: 1; border-color: #fff; transform: scale(1.05); }

  .btn {
    display: block; width: 100%; padding: 16px; font-size: 1.2rem; font-weight: 700;
    border: none; border-radius: 8px; cursor: pointer; color: #fff; margin-top: 20px;
    background: linear-gradient(135deg, #7b2ff7, #c471f5);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(123,47,247,.5); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

  .error-msg { color: #e74c3c; font-size: .9rem; margin-top: 10px; text-align: center; }

  /* Waiting screen */
  #wait-screen { text-align: center; padding-top: 60px; }
  #wait-screen .team-badge {
    display: inline-block; padding: 10px 24px; border-radius: 8px;
    font-weight: 700; font-size: 1.2rem; color: #fff; margin: 12px 0 20px;
  }
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }

  /* Game screen */
  #game-screen { text-align: center; }
  .g-progress { font-size: .9rem; opacity: .6; margin-bottom: 4px; }
  .g-timer { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; }
  .g-question {
    background: var(--card); border-radius: 12px; padding: 24px 16px;
    font-size: 1.2rem; line-height: 1.4; margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  .g-answers { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .g-answer {
    padding: 18px 16px; font-size: 1.1rem; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer; color: #fff;
    text-align: left; transition: transform .15s, opacity .15s;
  }
  .g-answer:active { transform: scale(.97); }
  .g-answer:nth-child(1) { background: var(--team1); }
  .g-answer:nth-child(2) { background: var(--team2); }
  .g-answer:nth-child(3) { background: var(--team3); }
  .g-answer:nth-child(4) { background: var(--team4); }
  .g-answer.selected { outline: 4px solid #fff; transform: scale(1.03); }
  .g-answer.disabled { opacity: .5; cursor: not-allowed; }

  /* Answered screen */
  #answered-screen {
    text-align: center; padding-top: 60px;
  }
  #answered-screen .big-check { font-size: 4rem; margin-bottom: 12px; }
  #answered-screen p { font-size: 1.1rem; opacity: .8; }

  /* Result screen */
  #result-screen { text-align: center; padding-top: 30px; }
  #result-screen .result-icon { font-size: 3rem; margin-bottom: 10px; }
  #result-screen .result-text { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
  #result-screen .result-answer { font-size: 1rem; opacity: .8; margin-bottom: 20px; }
  .score-display {
    display: inline-block; padding: 14px 28px; border-radius: 10px;
    background: var(--card); font-size: 1.4rem; font-weight: 700;
  }

  /* Final screen */
  #final-screen { text-align: center; padding-top: 30px; }
  #final-screen h2 { font-size: 1.6rem; margin-bottom: 16px; }
  .final-list { list-style: none; padding: 0; }
  .final-list li {
    padding: 12px 16px; margin-bottom: 8px; border-radius: 8px;
    background: var(--card); display: flex; justify-content: space-between;
    font-size: 1.05rem;
  }
  .final-list li .rank-name span { font-weight: 700; }
</style>
</head>
<body>

<h1>Quiz Battle</h1>

<!-- JOIN -->
<div id="join-screen" class="screen active">
  <label for="player-name">Your Name</label>
  <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" autocomplete="off" />

  <label>Choose Your Team</label>
  <div class="team-select" id="team-select"></div>

  <button class="btn" id="join-btn" disabled onclick="joinGame()">Join Game</button>
  <div class="error-msg" id="error-msg"></div>
</div>

<!-- WAITING -->
<div id="wait-screen" class="screen">
  <h2>You're in!</h2>
  <div class="team-badge" id="wait-team-badge"></div>
  <p class="pulse">Waiting for host to start the game...</p>
</div>

<!-- GAME (answering) -->
<div id="game-screen" class="screen">
  <div class="g-progress" id="g-progress"></div>
  <div class="g-timer" id="g-timer"></div>
  <div class="g-question" id="g-question"></div>
  <div class="g-answers" id="g-answers"></div>
</div>

<!-- ANSWERED (waiting for others) -->
<div id="answered-screen" class="screen">
  <div class="big-check">&#10003;</div>
  <p>Answer locked in!<br>Waiting for results...</p>
</div>

<!-- ROUND RESULT -->
<div id="result-screen" class="screen">
  <div class="result-icon" id="res-icon"></div>
  <div class="result-text" id="res-text"></div>
  <div class="result-answer" id="res-answer"></div>
  <div class="score-display" id="res-score"></div>
  <p style="margin-top:16px;opacity:.6" class="pulse">Next question coming up...</p>
</div>

<!-- FINAL -->
<div id="final-screen" class="screen">
  <h2>Final Results</h2>
  <ul class="final-list" id="final-list"></ul>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const TEAM_NAMES = ['Team 1','Team 2','Team 3','Team 4','Team 5','Team 6'];
const TEAM_COLORS = ['#e21b3c','#1368ce','#d89e00','#26890c','#9b59b6','#e67e22'];
const LABELS = ['A', 'B', 'C', 'D'];
const TIME_LIMIT = 60;

let selectedTeam = -1;
let visitorId = localStorage.getItem('quizVisitorId');
if (!visitorId) {
  visitorId = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem('quizVisitorId', visitorId);
}
let myTeam = -1;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Build team selection
const teamSelect = document.getElementById('team-select');
TEAM_NAMES.forEach((name, i) => {
  const div = document.createElement('div');
  div.className = 'team-option';
  div.style.background = TEAM_COLORS[i];
  div.textContent = name;
  div.onclick = () => {
    selectedTeam = i;
    teamSelect.querySelectorAll('.team-option').forEach(o => o.classList.remove('selected'));
    div.classList.add('selected');
    checkJoinReady();
  };
  teamSelect.appendChild(div);
});

const nameInput = document.getElementById('player-name');
nameInput.addEventListener('input', checkJoinReady);

function checkJoinReady() {
  document.getElementById('join-btn').disabled =
    !(nameInput.value.trim() && selectedTeam >= 0);
}

function joinGame() {
  const name = nameInput.value.trim();
  if (!name || selectedTeam < 0) return;
  myTeam = selectedTeam;
  socket.emit('player:join', { name, team: myTeam, visitorId });
}

socket.on('player:joined', ({ team, name }) => {
  const badge = document.getElementById('wait-team-badge');
  badge.textContent = TEAM_NAMES[team] + ' - ' + name;
  badge.style.background = TEAM_COLORS[team];
  show('wait-screen');
});

socket.on('player:error', (msg) => {
  document.getElementById('error-msg').textContent = msg;
});

// Question arrives
socket.on('player:question', (data) => {
  show('game-screen');
  document.getElementById('g-progress').textContent =
    `Question ${data.index} of ${data.total}`;
  document.getElementById('g-timer').textContent = data.timeLeft + 's';
  document.getElementById('g-question').textContent = data.question;

  const answersDiv = document.getElementById('g-answers');
  answersDiv.innerHTML = '';
  data.answers.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'g-answer';
    btn.textContent = `${LABELS[i]}.  ${a}`;
    btn.onclick = () => {
      socket.emit('player:answer', { visitorId, answer: i });
      answersDiv.querySelectorAll('.g-answer').forEach(b => {
        b.classList.remove('selected');
        b.classList.add('disabled');
        b.onclick = null;
      });
      btn.classList.add('selected');
      btn.classList.remove('disabled');
      setTimeout(() => show('answered-screen'), 400);
    };
    answersDiv.appendChild(btn);
  });
});

socket.on('player:alreadyAnswered', () => {
  show('answered-screen');
});

socket.on('player:wait', () => {
  show('wait-screen');
});

socket.on('timer:tick', (t) => {
  const el = document.getElementById('g-timer');
  if (el) el.textContent = t + 's';
});

// Round results
socket.on('player:results', (data) => {
  const myTeamData = data.teams.find(t => t.team === myTeam);
  if (!myTeamData) { show('wait-screen'); return; }

  document.getElementById('res-icon').textContent = myTeamData.isCorrect ? '&#10003;' : '&#10007;';
  document.getElementById('res-icon').style.color = myTeamData.isCorrect ? '#2ecc71' : '#e74c3c';
  document.getElementById('res-text').textContent = myTeamData.isCorrect ? 'Correct!' : 'Wrong!';
  document.getElementById('res-answer').innerHTML =
    `Answer: <strong>${LABELS[data.correctIndex]}. ${data.correctText}</strong>`;
  document.getElementById('res-score').textContent = myTeamData.score + ' pts';
  show('result-screen');
});

// Final
socket.on('player:final', (data) => {
  const list = document.getElementById('final-list');
  list.innerHTML = data.ranked.map((r, i) =>
    `<li>
      <span class="rank-name"><span style="color:${r.color}">#${i + 1} ${r.name}</span></span>
      <span><strong>${r.score}</strong> pts</span>
    </li>`
  ).join('');
  show('final-screen');
});

// Restart
socket.on('player:restart', () => {
  show('wait-screen');
});

// Auto-rejoin on reconnect
socket.on('connect', () => {
  const savedName = nameInput.value.trim();
  if (myTeam >= 0 && savedName) {
    socket.emit('player:join', { name: savedName, team: myTeam, visitorId });
  }
});
</script>
</body>
</html>
